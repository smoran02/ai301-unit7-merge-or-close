<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge or Close</title>
<meta name="description" content="A team review game for CodePath AI301, unit 7: cover a maintainer's pull request queue, then ship a PR of your own.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23062F54'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%2300C385' font-family='Arial'%3E%E2%9C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout for Merge or Close. Colors, fonts, and shadows come from
   theme.css through the custom properties used below. Semantic fills
   follow the brand: mint for passing or merged, pale peach with a soft
   rose marker for failing or closed, sky for neutral information,
   buttermilk for caution. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
p { margin: 0 0 10px; }
code {
  font-family: var(--font-code);
  font-size: 0.9em;
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: var(--code-radius);
  word-break: break-word;
}

/* header */
.bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px;
  background: var(--bar-bg);
  border-bottom: var(--bar-border);
  backdrop-filter: blur(6px);
}
.bar .logo { height: 18px; width: auto; display: block; flex: none; }
.hud { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; }
.hud-where { font-family: var(--font-code); font-weight: 700; }
.hud-clock { font-family: var(--font-code); font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 999px; background: var(--sky); }
.hud-clock.low { background: var(--peach); }
.meter { display: flex; align-items: center; gap: 6px; }
.meter-label { color: var(--ink-soft); }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 11px; height: 11px; border-radius: 3px; background: var(--pip-empty); transition: background 0.3s; }
.meter.health .pip.on { background: var(--health); }
.meter.goodwill .pip.on { background: var(--goodwill); }
.meter.bump { animation: bump 0.7s; }
@keyframes bump { 30% { transform: scale(1.18); } 60% { transform: scale(0.96); } }

main { position: relative; max-width: 1120px; margin: 0 auto; padding: 26px 16px 72px; }
main.narrow { max-width: 860px; }

.eyebrow {
  margin: 0 0 8px;
  font-family: var(--eyebrow-font);
  font-weight: var(--eyebrow-weight);
  font-size: 13px;
  letter-spacing: var(--eyebrow-spacing);
  text-transform: uppercase;
  color: var(--eyebrow-color);
}
.title {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(26px, 4.6vw, 36px);
  line-height: 1.2;
  color: var(--title-color);
}
.title.big { font-size: clamp(36px, 7.5vw, 58px); }
.lead { font-size: 18px; line-height: 1.5; max-width: 64ch; margin: 0 0 8px; }
.soft { color: var(--ink-soft); }
.small { font-size: 14px; }

/* hero (start and final screens) */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--hero-radius);
  background: var(--hero-bg);
  color: var(--hero-ink);
  padding: 40px 32px 36px;
  margin-bottom: 28px;
}
.hero .hero-text { position: relative; z-index: 1; max-width: 720px; }
.hero .eyebrow { color: var(--hero-eyebrow); }
.hero .title { color: var(--hero-ink); }
.hero-art { position: absolute; inset: 0; pointer-events: none; }
.splotch { display: none; }

/* bullet lists with the green heavy asterisk */
ul.stars { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 10px; max-width: 72ch; }
ul.stars li { position: relative; padding-left: 26px; }
ul.stars li::before { content: '\2731'; position: absolute; left: 0; top: 0; color: var(--green); font-weight: 700; }

/* buttons */
.cta, .btn-close {
  border: 0; border-radius: var(--btn-radius);
  padding: 12px 22px; font-weight: 600; font-size: 16px; cursor: pointer;
  color: #FFFFFF;
}
.cta { background: #4F5DFF; }
.btn-close { background: var(--ink); }
.cta:disabled, .btn-close:disabled { opacity: 0.45; cursor: not-allowed; }
.ghost {
  background: var(--ghost-bg); border: 0; border-radius: var(--btn-radius);
  padding: 10px 16px; font-size: 15px; cursor: pointer;
}
.ghost:disabled { opacity: 0.6; cursor: not-allowed; }
.ghost.armed { background: var(--peach); font-weight: 600; }
.linkish { background: none; border: 0; padding: 0; color: #4F5DFF; font-weight: 600; text-decoration: underline; cursor: pointer; }
.cta:focus-visible, .btn-close:focus-visible, .ghost:focus-visible, .linkish:focus-visible,
.choice:focus-visible, .reason:focus-visible, .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* start screen */
.panel { margin-bottom: 18px; padding: 20px; background: #FFFFFF; border-radius: var(--radius-lg); box-shadow: var(--lift); }
label { display: block; font-weight: 600; margin-bottom: 2px; }
.field-help { color: var(--ink-soft); font-size: 14px; margin-bottom: 10px; }
input[type=text] {
  flex: 1 1 220px; min-width: 0;
  font-family: var(--font-body); font-size: 18px;
  padding: 11px 14px; color: var(--ink);
  background: var(--input-bg); border: var(--input-border); border-radius: var(--radius);
}
input[type=text]:focus { outline: 3px solid var(--focus); outline-offset: 1px; }

/* the game's two-column layout: the work on the left, reference on the right */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.side { position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow-y: auto; padding-bottom: 8px; }
.side.more::after {
  content: "More below"; position: sticky; bottom: -8px; display: block;
  margin-top: -36px; padding: 26px 0 6px; text-align: center;
  font-size: 12px; font-weight: 600; color: var(--ink-soft);
  background: linear-gradient(rgba(255, 255, 255, 0), var(--ground) 65%);
}
.side-mobile { display: none; }
.side h2 { font-family: var(--font-body); font-size: 15px; font-weight: 700; margin: 0 0 10px; }

/* house rules */
ol.rules { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
ol.rules li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; }
.rule-n {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--green); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 13px;
}
.rule-name { font-weight: 600; font-size: 14px; }
.rule-text { font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
.new { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--butter); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; vertical-align: 1px; }
.doc { background: var(--doc); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; }
.doc-head { font-family: var(--font-code); font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.doc pre, .term pre {
  margin: 0; font-family: var(--font-code); font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
}
.mf-h { font-size: 13px; font-weight: 600; margin: 6px 0 2px; }
ul.mf { list-style: none; margin: 0 0 6px; padding: 0; }
ul.mf li { padding: 4px 0; font-size: 14px; }
ul.mf .job { font-size: 13px; min-width: 0; margin-right: 4px; }
.known { background: var(--butter); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }

/* a pull request card */
.where { margin-bottom: 8px; }
.pr { background: #FFFFFF; border-radius: var(--radius-lg); box-shadow: var(--lift); }
.pr-head { padding: 20px 22px 14px; }
.pr-title { margin: 0 0 8px; font-family: var(--font-body); font-weight: 600; font-size: 22px; line-height: 1.3; }
.pr-num { color: var(--ink-soft); font-weight: 400; }
.byline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); }
.byline b { color: var(--ink); font-weight: 600; }
.avatar {
  width: 26px; height: 26px; flex: none; border-radius: 50%; display: inline-grid; place-items: center;
  font-weight: 700; font-size: 13px; color: var(--ink);
}
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sky); color: var(--ink); }
.pr-sec { padding: 14px 22px; border-top: 1px solid var(--hair); }
.sec-h { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.issue { background: var(--sky); border-radius: var(--radius); padding: 10px 14px; }
.issue-t { font-weight: 600; }
.issue-b { font-size: 14px; margin-top: 2px; }
.desc { background: var(--doc); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; }
.desc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.desc li { display: grid; grid-template-columns: 22px 1fr; gap: 4px; }
.desc .item-n { font-family: var(--font-code); font-weight: 700; }
.desc .item-l { font-weight: 600; }
ul.lines { list-style: none; margin: 0; padding: 0; font-family: var(--font-code); font-size: 14px; }
ul.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--hair); }
ul.lines li:last-child { border-bottom: 0; }
ul.lines .path { word-break: break-all; }
.stat { flex: none; white-space: nowrap; }
.add { color: var(--add); font-weight: 700; }
.del { color: var(--rose); font-weight: 700; }
ul.commits { list-style: none; margin: 0; padding: 0; }
ul.commits li { padding: 6px 0 6px 22px; position: relative; border-bottom: 1px solid var(--hair); font-size: 15px; }
ul.commits li:last-child { border-bottom: 0; }
ul.commits li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.commit-file { display: block; font-family: var(--font-code); font-size: 12px; color: var(--ink-soft); }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.checks li { display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-radius: var(--radius); font-size: 14px; }
ul.checks li.pass { background: var(--mint); }
ul.checks li.fail { background: var(--peach); }
.mark { font-weight: 700; width: 16px; text-align: center; }
.pass .mark { color: var(--add); }
.fail .mark { color: var(--rose); }
.job { font-family: var(--font-code); font-weight: 700; min-width: 48px; }
.diff { background: var(--doc); border-radius: var(--radius); overflow: hidden; }
.diff pre { margin: 0; padding: 8px 12px; font-family: var(--font-code); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.diff .plus { background: var(--mint); display: block; }

/* actions and outcomes */
.actions {
  position: sticky; bottom: 0; z-index: 5;
  padding: 14px 22px 16px; background: rgba(255, 255, 255, 0.97);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  box-shadow: 0 -8px 18px rgba(6, 47, 84, 0.08);
}
.hintbox { margin: 0 0 12px; }
.actions .row .cta, .actions .row .btn-close { min-width: 130px; }
/* the close picker's buttons stay in view while a long rule list scrolls */
.modal-foot {
  position: sticky; bottom: -24px; z-index: 1;
  margin: 12px -24px -24px; padding: 12px 24px 24px; background: #FFFFFF;
  box-shadow: 0 -10px 14px -12px rgba(6, 47, 84, 0.35);
}
.reason {
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 6px; border: 2px solid transparent; border-radius: var(--radius);
  background: var(--doc); cursor: pointer;
}
.reason[aria-pressed=true] { border-color: var(--ink); background: var(--sky); }
.bubble { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; margin-top: 12px; }
.bubble-body { background: var(--doc); border-radius: var(--radius); padding: 10px 14px; font-size: 15px; }
.bubble-who { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.stamp {
  display: inline-block; padding: 4px 14px; border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; font-size: 15px;
  animation: stamp 0.35s ease-out;
}
.stamp.merged { background: var(--mint); }
.stamp.closed { background: var(--peach); }
@keyframes stamp { from { transform: scale(1.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.cost { display: inline-block; margin-left: 10px; font-size: 14px; font-weight: 600; color: var(--rose-text); }

/* pop-ups: picking a rule, and the contributor's reply */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  display: grid; place-items: center; padding: 16px;
  background: rgba(6, 47, 84, 0.55); overflow-y: auto;
}
.modal {
  width: 100%; max-width: 620px; max-height: calc(100vh - 32px); overflow-y: auto;
  padding: 24px; background: #FFFFFF; border-radius: var(--radius-lg);
  box-shadow: 0 12px 34px rgba(6, 47, 84, 0.28);
  animation: rise 0.3s ease-out;
}
.modal-h { margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.25; }
.modal.still, .modal.still .stamp { animation: none; }
.hintbox:focus { outline: none; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Ren's notes, memos, and overnight issues */
.memo { background: var(--sky); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 20px; }
.memo-who { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
.memo-who b { font-size: 15px; }
.memo .rules { margin-top: 6px; }
.memo .rule-text { color: var(--ink); }
.memo .doc { background: #FFFFFF; }
.card { background: #FFFFFF; border-radius: var(--radius-lg); box-shadow: var(--lift); padding: 16px 20px; margin-bottom: 14px; }
.card.issue-card { border-left: 4px solid var(--rose); }
.card h3 { margin: 4px 0 6px; font-size: 17px; }
.card .cause { font-size: 14px; color: var(--ink-soft); margin: 6px 0 0; }
.note-row { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.note-row:last-child { border-bottom: 0; }
.verdict-mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
.verdict-mark.ok { background: var(--mint); color: var(--add); }
.verdict-mark.no { background: var(--peach); color: var(--rose); }
.verdict-mark.skip { background: var(--butter); }
.note-t { font-weight: 600; }
.note-calls { font-size: 14px; color: var(--ink-soft); margin: 2px 0 4px; }
.note-why { font-size: 15px; }
.tally { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 22px; }
.tile { flex: 1 1 150px; padding: 14px 16px; background: var(--sky); border-radius: var(--radius); }
.tile-n { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.tile-l { font-size: 13px; color: var(--ink-soft); }

/* day 4: the terminal and the choices */
.term { background: var(--term-bg); color: var(--term-ink); border-radius: var(--radius-lg); box-shadow: var(--term-shadow); padding: 14px 16px; margin-bottom: 18px; }
.term .line { display: block; min-height: 1.6em; }
.term .line.in { animation: typein 0.25s ease-out; }
@keyframes typein { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
.term .prompt { color: var(--term-head-ink); }
.term .stop { color: var(--stop-ink); font-weight: 700; }
.term .pass { color: #93FCAC; font-weight: 700; }
.term .url { color: #9FD8FF; text-decoration: underline; }
.ask { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
.choices { display: grid; gap: 8px; }
.choice {
  display: block; width: 100%; text-align: left; padding: 12px 14px;
  border: 2px solid transparent; border-radius: var(--radius); background: var(--doc); cursor: pointer; font-size: 15px;
}
.choice.mono { font-family: var(--font-code); font-size: 13.5px; word-break: break-word; }
.choice .sub { display: block; font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.choice[aria-pressed=true] { border-color: var(--ink); background: var(--sky); }
.choice:disabled { cursor: not-allowed; opacity: 0.55; }
.choice[aria-pressed=true]:disabled { opacity: 1; }
.part { margin-bottom: 16px; }
.part-h { font-family: var(--font-code); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.result { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); }
.result.good { background: var(--mint); }
.result.bad { background: var(--peach); }
.result .wait { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

/* read along */
.read-banner { margin-bottom: 16px; padding: 10px 14px; background: var(--butter); border-radius: var(--radius); font-size: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tab { padding: 8px 14px; border-radius: 999px; border: 0; background: var(--doc); font-weight: 600; font-size: 14px; cursor: pointer; }
.tab[aria-selected=true] { background: var(--ink); color: #FFFFFF; }
.stack > * + * { margin-top: 22px; }

/* final screen review */
.review details { background: var(--doc); border-radius: var(--radius); margin-bottom: 10px; }
.review summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
.review .inner { padding: 0 16px 8px; }
.review .note-row { border-bottom-color: #E2E5EA; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 28px; font-size: 12px; color: var(--ink-soft); }
footer.narrow { max-width: 860px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .side-mobile { display: block; margin-bottom: 16px; }
  .side-mobile > details { background: var(--doc); border-radius: var(--radius); }
  .side-mobile summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
  .side-mobile .inner { padding: 0 14px 10px; }
  .side-mobile .inner > h2:first-child { display: none; }
}
@media (max-width: 560px) {
  .hero { padding: 28px 20px 26px; }
  .bar { padding: 8px 12px; flex-wrap: wrap; row-gap: 6px; }
  .hud { gap: 8px; width: 100%; justify-content: space-between; }
  .hud-where { display: none; }
  .pr-head, .pr-sec, .actions { padding-left: 16px; padding-right: 16px; }
  .actions .row .cta, .actions .row .btn-close { flex: 1 1 0; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The AI301 codepath-brand skill
   (engagements/ai301/.claude/skills/codepath-brand). Medium Navy text,
   Space Mono / Poppins / Roboto Mono, green eyebrows and heavy-asterisk
   markers, tint-filled rounded containers (no bare outlined boxes),
   subtle straight-down navy shadows, gradient splotches. */
:root {
  --ground: #FFFFFF;
  --ink: #062F54;
  --ink-soft: #5A6472;
  --title-color: #062F54;
  --green: #00C385;
  --font-display: 'Space Mono', ui-monospace, monospace;
  --font-body: 'Poppins', system-ui, sans-serif;
  --font-code: 'Roboto Mono', ui-monospace, monospace;
  --eyebrow-font: 'Poppins', system-ui, sans-serif;
  --eyebrow-weight: 700;
  --eyebrow-spacing: 0.06em;
  --eyebrow-color: #00C385;
  --radius: 8px;
  --radius-lg: 14px;
  --btn-radius: 8px;
  --code-radius: 4px;
  --code-bg: rgba(6, 47, 84, 0.08);
  --bar-bg: rgba(255, 255, 255, 0.94);
  --bar-border: 1px solid #E3E8EE;
  --hero-radius: 18px;
  --hero-bg: linear-gradient(125deg, #1B1C57 0%, #3B2A8F 38%, #4F5DFF 70%, #02BCFF 100%);
  --hero-ink: #FFFFFF;
  --hero-eyebrow: #FFFFFF;
  /* semantic tints: sky neutral, grey documents, mint passing, pale
     peach failing (soft rose marker), buttermilk caution */
  --sky: #E9F6FF;
  --doc: #F5F5F5;
  --mint: #D7FFEE;
  --peach: #FFEDF0;
  --butter: #FFF6BF;
  --rose: #C36E91;
  --rose-text: #9E4A6E;
  --add: #007A55;
  --hair: #EBEEF2;
  --lift: 0 6px 20px rgba(6, 47, 84, 0.14);
  --term-bg: #062F54;
  --term-ink: #FFFFFF;

const LOCK_MS = 10000;        // day 4: the wait after a wrong move
const HINT_COST_MS = 60000;   // a hint from Ren takes this much off the clock
const HINT_WAIT_MS = 30000;   // Message Ren opens this long after a PR comes up
const CONFIRM_MS = 8000;      // how long a "press again to confirm" stays armed
const METER_MAX = 5;

// ------------------------------------------------------------------ core
// No DOM in this part, so test_core.js can run it in Node.

// Answers ship obfuscated so the page source doesn't show the right calls.
function unbox(b64, id) {
  const bin = atob(b64);
  const key = new TextEncoder().encode(`${CFG.salt}:${id}`);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ ((key[i % key.length] + i * 31 + 7) & 255);
  return JSON.parse(new TextDecoder().decode(out));
}
const PRS = DATA.prs;
const BY_NUM = {};
PRS.forEach((p) => { BY_NUM[p.num] = p; });
const ANSWERS = {};
function answer(num) {
  if (!ANSWERS[num]) ANSWERS[num] = unbox(BY_NUM[num].box, `pr${num}`);
  return ANSWERS[num];
}
let STEPS = null;
function steps() {
  if (!STEPS) STEPS = unbox(DATA.day4.box, 'day4');
  return STEPS;
}
// Overtime is an optional bonus queue after day 4: no clock, no meters, and
// it doesn't count toward the score.
const OT = DATA.overtime;
function dayPrs(day) { return PRS.filter((p) => p.day === day); }
function mainPrs() { return PRS.filter((p) => p.day <= 3); }
function rulesFor(day) { return DATA.rules.filter((r) => r.day <= day); }
function rule(id) { return DATA.rules.find((r) => r.id === id); }

// What happens to a call: right or wrong, and which meter moves now.
// A wrong merge costs project health overnight, not now.
function judge(num, call, reason) {
  const a = answer(num);
  if (call === 'merge') return { right: a.verdict === 'merge', kind: a.verdict === 'merge' ? 'merged' : 'badMerge' };
  if (a.verdict === 'merge') return { right: false, kind: 'goodClosed' };
  if (a.reasons.includes(reason)) return { right: true, kind: 'closedOk' };
  return { right: false, kind: 'wrongReason' };
}

function newState(team, now, id) {
  return {
    v: 1, id, team, startedAt: now, phase: 'memo', day: 1, idx: 0, pending: null,
    decisions: {}, hinted: {}, health: METER_MAX, goodwill: METER_MAX,
    clockEndsAt: null, overnight: [], hints: 0, prSince: null,
    d4: { step: 0, picks: {}, lockUntil: 0, result: null, wrong: 0, seen: {}, first: {} },
    finishedAt: null, overtime: null,
  };
}
function openQueue(s, now) {
  s.phase = 'queue'; s.idx = 0; s.pending = null; s.prSince = now;
  s.clockEndsAt = DATA.dayMinutes[s.day] ? now + DATA.dayMinutes[s.day] * 60000 : null;
}
// The clock is Ren's suggested pace. When it runs out the queue stays open
// and the clock counts how far over the team is.
function timeLeft(s, now) { return s.clockEndsAt ? Math.max(0, s.clockEndsAt - now) : 0; }
function overBy(s, now) { return s.clockEndsAt ? Math.max(0, now - s.clockEndsAt) : 0; }
// cost records whether a meter really moved (or will overnight), so the
// pop-up never shows a loss the meter can't take at 0.
function decide(s, num, call, reason) {
  const j = judge(num, call, reason);
  let cost = false;
  if (s.day !== OT && (j.kind === 'goodClosed' || j.kind === 'wrongReason')) {
    cost = s.goodwill > 0;
    s.goodwill = Math.max(0, s.goodwill - 1);
  } else if (s.day !== OT && j.kind === 'badMerge') {
    const bad = dayPrs(s.day).filter((p) => p.num !== num && s.decisions[p.num] && s.decisions[p.num].kind === 'badMerge').length;
    cost = s.health > bad;
  }
  s.decisions[num] = { call, reason: call === 'close' ? reason : null, right: j.right, kind: j.kind, cost };
  s.pending = num;
  return j;
}
// The day ends when every PR has a call. Wrong merges each cost one
// project health, delivered overnight. Ren's notes mention a day that ran
// past the suggested time.
function endDay(s, now = Date.now()) {
  const prs = dayPrs(s.day);
  s.dayOver = overBy(s, now);
  if (s.day === OT) { s.overnight = []; s.clockEndsAt = null; s.pending = null; s.phase = 'notes'; return; }
  s.overnight = prs.filter((p) => s.decisions[p.num] && s.decisions[p.num].kind === 'badMerge').map((p) => p.num);
  const before = s.health;
  s.health = Math.max(0, s.health - s.overnight.length);
  s.healthLost = before - s.health;
  s.clockEndsAt = null; s.pending = null;
  s.phase = s.overnight.length ? 'overnight' : 'notes';
}
function nextPr(s, now = Date.now()) {
  s.pending = null; s.idx += 1; s.prSince = now;
  if (s.idx >= dayPrs(s.day).length) endDay(s, now);
}
function afterNotes(s) {
  if (s.day === OT) { s.overtime = 'done'; s.phase = 'done'; } else if (s.day < 3) { s.day += 1; s.phase = 'memo'; s.idx = 0; } else { s.day = 4; s.phase = 'day4'; }
}
function startOvertime(s) { s.day = OT; s.phase = 'memo'; s.idx = 0; s.pending = null; s.overtime = 'playing'; }
function useHint(s, num, now) {
  if (s.hinted[num]) return;
  s.hinted[num] = true; s.hints += 1;
  if (s.clockEndsAt) s.clockEndsAt -= HINT_COST_MS;
}
// Message Ren stays locked for the first 30 seconds on each PR, so the team
// reads it before asking. A save from before this field never locks.
function hintWait(s, now) {
  return s.phase === 'queue' && s.prSince ? Math.max(0, s.prSince + HINT_WAIT_MS - now) : 0;
}
function rightCount(s) { return mainPrs().filter((p) => s.decisions[p.num] && s.decisions[p.num].right).length; }
function dayRight(s, day) { return dayPrs(day).filter((p) => s.decisions[p.num] && s.decisions[p.num].right).length; }

// Day 4: one pick per step (or one per failing check on the reject step).
function d4Submit(s, now) {
  const st = steps()[s.d4.step];
  if (!st || now < s.d4.lockUntil) return null;
  let right; let says; let out = null;
  if (st.parts) {
    if (st.parts.some((pt) => s.d4.picks[pt.id] === undefined)) return null;
    const wrong = st.parts.filter((pt) => !pt.options[s.d4.picks[pt.id]].right);
    right = wrong.length === 0;
    says = (right ? st.parts : wrong).map((pt) => ({ label: pt.label, text: pt.options[s.d4.picks[pt.id]].say }));
  } else {
    const o = st.options[s.d4.picks.main];
    if (!o) return null;
    right = !!o.right; says = [{ label: '', text: o.say }]; out = o.out || null;
  }
  s.d4.result = { right, says, out };
  if (!right) { s.d4.wrong += 1; s.d4.lockUntil = now + LOCK_MS; }
  // The board marks a step by the team's first try. A save from before
  // this field existed starts it empty.
  if (!s.d4.first) s.d4.first = {};
  if (!(s.d4.step in s.d4.first)) s.d4.first[s.d4.step] = right;
  return s.d4.result;
}
function d4Next(s) {
  s.d4.step += 1; s.d4.picks = {}; s.d4.result = null; s.d4.lockUntil = 0;
}
function finish(s, now) { s.finishedAt = now; s.phase = 'done'; }

// The board's progress strip, one group per day: each PR's call
// (g right, r wrong, . not yet), then each day-4 step by its first try.
// Example: "201:g 202:r 203:. 204:. | ... | open:g row:. ..."
function marks(s) {
  const m = (v) => (v === undefined ? '.' : v ? 'g' : 'r');
  const days = [1, 2, 3].map((d) => dayPrs(d)
    .map((p) => `${p.num}:${m(s.decisions[p.num] ? s.decisions[p.num].right : undefined)}`).join(' '));
  const first = s.d4.first || {};
  days.push(steps().map((st, i) => `${st.id}:${m(first[i])}`).join(' '));
  return days.join(' | ');
}

  del(k) { try { localStorage.removeItem(k); } catch (e) { /* nothing to clear */ } },

function save() { if (state) store.set(CFG.storeKey, state); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(ms) {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}
function waitText(ms) {
  const n = Math.ceil(ms / 1000);
  return `Try again in ${n} second${n === 1 ? '' : 's'}.`;
}
// A press that arms a confirm stays armed for CONFIRM_MS.
function armed(at) { return !!at && Date.now() - at < CONFIRM_MS; }
function teamLabel(n) { return /^team\b/i.test(n) ? n : `Team ${n}`; }
function dayName(d) { return d === OT ? 'Overtime' : `Day ${d}`; }
function newId() {
  const b = new Uint8Array(8);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); });
  return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
}

// One snapshot per event for the instructor's board. Fire and forget.
// Overtime comes after the finish, so the board keeps showing the team as done.
function report(type, extra = {}) {
  if (!CFG.reportUrl || !state || state.day === OT) return;
  const where = state.phase === 'done' ? 'done' : state.day === 4 ? 'yourpr' : `d${state.day}`;
  const body = JSON.stringify(Object.assign({
    team: state.id, name: state.team, type, where, day: state.day,
    pr: state.phase === 'queue' ? state.idx + 1 : 0,
    of: state.day <= 3 ? dayPrs(state.day).length : 0,
    right: rightCount(state), decided: Object.keys(state.decisions).length,
    health: state.health, goodwill: state.goodwill, hints: state.hints,
    elapsed: (state.finishedAt || Date.now()) - state.startedAt, finished: !!state.finishedAt,
    marks: marks(state),
    // The day's clock as the team sees it: time left, below 0 once it's over.
    clock: state.phase === 'queue' && state.clockEndsAt ? state.clockEndsAt - Date.now() : null,
    // Reports can arrive out of order; the board keeps the newest by this.
    at: Date.now(),
  }, extra));
  try {
    fetch(CFG.reportUrl, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body,
    }).catch(() => {});
  } catch (e) { /* offline or blocked: keep playing */ }
}

// ------------------------------------------------------------ pieces
const AVATAR_FILLS = ['#D7FFEE', '#E9F6FF', '#FFF6BF', '#FFEEFF', '#FFEDF0', '#93FCAC', '#FEA08D', '#9FD8FF'];
function avatar(name) {
  if (name === 'Ren') return '<span class="avatar" style="background:#00C385" aria-hidden="true">R</span>';
  if (name === 'you') return '<span class="avatar" style="background:#4F5DFF;color:#FFFFFF" aria-hidden="true">Y</span>';
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar" style="background:${AVATAR_FILLS[h % AVATAR_FILLS.length]}" aria-hidden="true">${esc(name[0].toUpperCase())}</span>`;
}
function pips(n) {
  let out = '';
  for (let i = 0; i < METER_MAX; i++) out += `<span class="pip${i < n ? ' on' : ''}"></span>`;
  return out;
}
function meters() {
  const m = (cls, label, full, n) => `<span class="meter ${cls}" id="m-${cls}" title="${full}: ${n} of ${METER_MAX}">`
    + `<span class="meter-label">${label}</span><span class="pips" role="img" aria-label="${full}: ${n} of ${METER_MAX}">${pips(n)}</span></span>`;
  return m('health', 'Health', 'Project health', state.health) + m('goodwill', 'Goodwill', 'Contributor goodwill', state.goodwill);
}
function bubble(who, html) {
  const name = who === 'Ren' ? 'Ren' : who === 'you' ? 'You' : `@${esc(who)}`;
  return `<div class="bubble">${avatar(who)}<div class="bubble-body"><div class="bubble-who">${name}</div>${html}</div></div>`;
}
function ruleList(list, markNew) {
  return `<ol class="rules">${list.map((r) => `<li><span class="rule-n">${r.n}</span><div>`
    + `<div class="rule-name">${r.name}${markNew && r.day === markNew ? '<span class="new">NEW</span>' : ''}</div>`
    + `<div class="rule-text">${r.text}</div></div></li>`).join('')}</ol>`;
}
function templateDoc() {
  return `<div class="doc"><div class="doc-head">.github/pull_request_template.md</div><pre>${DATA.template.map(esc).join('\n')}</pre></div>`;
}
// The house rules are playlistr's CONTRIBUTING.md, shown as the repo file.
function contributing(list, markNew) {
  return `<div class="doc"><div class="doc-head">CONTRIBUTING.md</div>${ruleList(list, markNew)}</div>`;
}
// The known issue sits right under the rules, since rule 5 points to it.
function rulebook(day) {
  return `<h2>House rules</h2>${contributing(rulesFor(day), day)}`
    + (day >= 3 ? `<h2>Known issue</h2><div class="known">${DATA.knownIssue}</div>` : '')
    + (day >= 2 ? `<h2>The PR template</h2>${templateDoc()}` : '');
}
function withSide(main, side, sideTitle) {
  return `<div class="layout"><div><div class="side-mobile"><details><summary>${sideTitle}</summary>`
    + `<div class="inner">${side}</div></details></div>${main}</div><aside class="side">${side}</aside></div>`;
}

function prCard(p, footer, merged) {
  const desc = p.template
    ? `<ol>${p.template.map((it) => `<li><span class="item-n">${it.n}.</span><span>${it.label ? `<span class="item-l">${it.label}:</span> ` : ''}${it.text}</span></li>`).join('')}</ol>`
    : `<p style="margin:0">${p.desc}</p>`;
  const files = p.files.map((f) => `<li><span class="path">${esc(f.path)}</span><span class="stat">`
    + `<span class="add">+${f.add}</span>${f.del ? ` <span class="del">-${f.del}</span>` : ''}</span></li>`).join('');
  // A commit is its message, or [message, body line] when the body matters.
  const commits = p.commits.map((c) => (Array.isArray(c)
    ? `<li>${esc(c[0])}<span class="commit-file">${esc(c[1])}</span></li>` : `<li>${esc(c)}</li>`)).join('');
  const checks = p.checks ? `<section class="pr-sec"><h2 class="sec-h">Checks</h2><ul class="checks">${p.checks.map((c) => `<li class="${c.state}" aria-label="${esc(c.job)} ${c.state === 'pass' ? 'passed' : 'failed'}: ${esc(c.detail)}">`
    + `<span class="mark" aria-hidden="true">${c.state === 'pass' ? '✓' : '✕'}</span><span class="job">${esc(c.job)}</span>`
    + `<span>${esc(c.detail)}</span></li>`).join('')}</ul></section>` : '';
  const diff = p.diff ? `<section class="pr-sec"><h2 class="sec-h">From the diff: ${esc(p.diff.file)}</h2><div class="diff"><pre>${p.diff.lines.map((l) => (l.sign === '+'
    ? `<span class="plus">+ ${esc(l.text)}</span>` : `  ${esc(l.text)}`)).join('\n')}</pre></div></section>` : '';
  return `<article class="pr" aria-label="Pull request ${p.num}">
    <div class="pr-head"><h1 class="pr-title">${esc(p.title)} <span class="pr-num">#${p.num}</span></h1>
      <div class="byline">${merged ? `${avatar('Ren')}<span><b>Ren</b> merged your PR into <code>main</code></span>`
    : `${avatar(p.author)}<span>${p.author === 'you' ? '<b>You</b> want' : `<b>${esc(p.author)}</b> wants`} to merge into <code>main</code></span>`}${p.firstTime ? '<span class="chip">First-time contributor</span>' : ''}</div></div>
    <section class="pr-sec"><h2 class="sec-h">Linked issue</h2><div class="issue"><div class="issue-t">#${p.issue.num} ${p.issue.title}</div><div class="issue-b">${p.issue.body}</div></div></section>
    <section class="pr-sec"><h2 class="sec-h">Description</h2><div class="desc">${desc}</div></section>
    <section class="pr-sec"><h2 class="sec-h">Files changed (${p.files.length})</h2><ul class="lines">${files}</ul></section>
    <section class="pr-sec"><h2 class="sec-h">Commits (${p.commits.length})</h2><ul class="commits">${commits}</ul></section>
    ${checks}${diff}${footer || ''}
  </article>`;
}

function callText(d) {
  if (!d) return "You didn't get to it";
  return d.call === 'merge' ? 'You merged it' : `You closed it, rule ${rule(d.reason).n}`;
}
function rightText(num) {
  const a = answer(num);
  if (a.verdict === 'merge') return 'Right call: merge';
  return `Right call: close, rule ${a.reasons.map((r) => rule(r).n).join(' or ')} (${a.reasons.map((r) => rule(r).name).join(' or ')})`;
}
function noteRows(day) {
  return dayPrs(day).map((p) => {
    const d = state.decisions[p.num];
    const cls = !d ? 'skip' : d.right ? 'ok' : 'no';
    const mark = !d ? '…' : d.right ? '✓' : '✕';
    return `<div class="note-row"><span class="verdict-mark ${cls}" aria-label="${!d ? 'not reviewed' : d.right ? 'right' : 'wrong'}">${mark}</span><div>`
      + `<div class="note-t">#${p.num} ${esc(p.title)}</div>`
      + `<div class="note-calls">${callText(d)} · ${rightText(p.num)}</div>`
      + `<div class="note-why">${answer(p.num).why}</div></div></div>`;
  }).join('');
}
function replyFor(p, d) {
  const a = answer(p.num);
  if (d.kind === 'merged' || d.kind === 'badMerge') return a.replyMerged || DATA.mergedReplies[p.num % DATA.mergedReplies.length];
  if (d.kind === 'closedOk') return a.replyClosedOk;
  const own = a.replyWrongClose && a.replyWrongClose[d.reason];
  if (own) return own;
  const name = esc(rule(d.reason).name);
  return (d.kind === 'goodClosed' ? DATA.goodClosedReply : DATA.wrongReasonReply).replace('{name}', name);
}

function termLine(line) {
  let h = esc(line);
  if (h.startsWith('$ ')) return `<span class="prompt">${h}</span>`;
  h = h.replace('STOP.', '<span class="stop">STOP.</span>').replace('PASS.', '<span class="pass">PASS.</span>');
  if (/^https:\/\//.test(line)) h = `<span class="url">${h}</span>`;
  return h;
}

// ------------------------------------------------------------ HUD
function setHud() {
  const hud = $('hud');
  if (reading !== null) {
    hud.hidden = false;
    hud.innerHTML = '<span class="hud-where">Reading along</span>';
    return;
  }
  if (!state || state.phase === 'done' || view.dataset.screen === 'start') { hud.hidden = true; return; }
  hud.hidden = false;
  let where = state.day === 4 ? 'Day 4 · Your PR' : dayName(state.day);
  if (state.phase === 'queue') where += ` · PR ${Math.min(state.idx + 1, dayPrs(state.day).length)} of ${dayPrs(state.day).length}`;
  hud.innerHTML = `<span class="hud-where">${where}</span>`
    + (state.phase === 'queue' && state.clockEndsAt ? '<span class="hud-clock" id="hud-clock"></span>' : '')
    + (state.day === OT ? '' : meters());
  ['health', 'goodwill'].forEach((k) => {
    if (shown[k] !== null && shown[k] !== state[k]) {
      const el = $(`m-${k}`);
      if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    }
    shown[k] = state[k];
  });
  updateClock();
}
function updateClock() {
  const el = $('hud-clock');
  if (!el || !state || state.phase !== 'queue' || !state.clockEndsAt) return;
  const now = Date.now();
  const left = timeLeft(state, now);
  el.textContent = left > 0 ? `${fmt(left)} left` : `${fmt(overBy(state, now))} over`;
  el.title = "Ren's suggested time for today. Going over is fine.";
  el.classList.toggle('low', left < 60000);
}

// ------------------------------------------------------------ screens
function show(screen, html, narrow) {
  view.dataset.screen = screen;
  view.className = narrow ? 'narrow' : '';
  $('foot').className = narrow ? 'narrow' : '';
  view.innerHTML = html;
  setHud();
  const side = view.querySelector('.side');
  if (side) { side.addEventListener('scroll', () => markMore(side)); markMore(side); }
}
// The side panel scrolls on its own, and most scrollbars stay hidden, so it
// says when there's more below.
function markMore(side) {
  side.classList.toggle('more', side.scrollHeight - side.scrollTop - side.clientHeight > 4);
}
window.addEventListener('resize', () => { const side = view.querySelector('.side'); if (side) markMore(side); });
// Each render rebuilds the screen, so keyboard focus goes back to the same
// control if it's still there and enabled.
function focusKey(el) {
  const d = el && el.dataset;
  return d && d.act ? [d.act, d.r, d.part, d.i, d.day].join('|') : null;
}
function refocus(key) {
  const el = key && Array.from(view.querySelectorAll('[data-act]')).find((x) => focusKey(x) === key);
  if (el && !el.disabled && !el.closest('[inert]')) el.focus({ preventScroll: true });
}
function focusAct(act) { refocus(focusKey(view.querySelector(`[data-act="${act}"]`))); }
function render(scroll = true) {
  const keep = focusKey(document.activeElement);
  draw();
  if (scroll) window.scrollTo(0, 0);
  if (!view.querySelector('.modal [autofocus]')) refocus(keep);
}
function draw() {
  if (reading !== null) renderRead();
  else if (!state) renderStart();
  else if (state.phase === 'memo') renderMemo();
  else if (state.phase === 'queue') renderQueue();
  else if (state.phase === 'overnight') renderOvernight();
  else if (state.phase === 'notes') renderNotes();
  else if (state.phase === 'day4') renderDay4();
  else renderDone();
}

// A saved game on this device: offer to keep going, and only show the
// new-team form after Start over, so a new name can't replace it by accident.
function renderStart() {
  const saved = store.get(CFG.storeKey);
  const hasSave = !!(saved && saved.team && saved.v === 1);
  const resume = hasSave
    ? `<div class="panel"><p>Welcome back, <b>${esc(saved.team)}</b>. ${saved.phase === 'done' ? 'You finished the game.' : saved.day === OT ? "You're in overtime." : saved.day === 4 ? "You're on day 4, opening your own PR." : `You're on day ${saved.day}.`}</p>
       <div class="row"><button class="cta" data-act="resume" type="button">Keep going</button>${resetButton('Start over', 'Yes, erase this game')}</div></div>`
    : '';
  const form = hasSave ? '' : `<form class="panel" id="team-form" autocomplete="off">
      <label for="team-name">Team name</label>
      <p class="field-help">Your breakout room number works, like Team 4.</p>
      <div class="row"><input type="text" id="team-name" maxlength="24" required><button class="cta" type="submit">Start the game</button></div>
    </form>`;
  show('start', `
    <div class="hero"><div class="hero-art" aria-hidden="true"><div class="splotch"><i></i><i></i><i></i><i></i></div></div>
      <div class="hero-text"><p class="eyebrow">AI301 · Unit 7 · Shipping it</p>
      <h1 class="title big">Merge or Close</h1>
      <p class="lead">Ren, the lead maintainer of playlistr (a made-up Python library), is away for three days, and your team is covering the pull request queue. Merge the PRs that are ready and close the ones that aren't. On day 4, Ren is back and you open a PR of your own.</p></div></div>
    <ul class="stars">
      <li><b>One screen per team.</b> One person shares this page in your breakout room and clicks for the team. Everyone else can open the same link and choose <b>Read along</b> to read the PRs on their own screen.</li>
      <li><b>Merge or close.</b> Each morning Ren adds to the house rules in playlistr's <code>CONTRIBUTING.md</code>. Merge a PR that follows all of them. Close one that breaks a rule, and pick the rule so the contributor knows what to fix.</li>
      <li><b>Two meters keep score.</b> Project health drops when you merge a PR that should have been closed. Contributor goodwill drops when you close a PR that was ready, or pick the wrong rule.</li>
      <li><b>Each day has a suggested time.</b> The clock helps your team keep pace so you reach day 4, and going over is fine. Stuck on a PR? After 30 seconds on it, you can message Ren for a hint. It takes a minute off the clock.</li>
    </ul>
    ${resume}
    ${form}
    <p class="soft">Not the sharer? <button class="linkish" data-act="read" type="button">Read along</button></p>`, true);
}

function memoBlock(paras, extra) {
  return `<div class="memo"><div class="memo-who">${avatar('Ren')}<span><b>Ren</b> · playlistr's lead maintainer</span></div>`
    + paras.map((t) => `<p>${t}</p>`).join('') + (extra || '') + '</div>';
}
const DAY_TITLES = { 1: 'Your first day on the queue', 2: 'Day 2 adds the PR template', 3: 'Day 3 adds the checks', [OT]: 'Four more PRs' };
function memoFor(day) {
  const fresh = DATA.rules.filter((r) => r.day === day);
  return memoBlock(DATA.memos[day], (fresh.length ? contributing(fresh, day) : '') + (day === 2 ? templateDoc() : ''));
}
function renderMemo() {
  const d = state.day;
  const clock = DATA.dayMinutes[d]
    ? `Aim for <b>${DATA.dayMinutes[d]} minutes</b> on these ${dayPrs(d).length} PRs. The clock starts when you open the queue. If you go over, keep going, and try to pick up the pace so there's time for day 4.`
    : `<b>${dayPrs(d).length} PRs</b>, no clock.`;
  show('memo', `<p class="eyebrow">${dayName(d)} · Ren's note</p><h1 class="title">${DAY_TITLES[d]}</h1>
    ${memoFor(d)}
    <p>${clock}</p>
    <button class="cta" data-act="open-queue" type="button">Open the queue</button>`, true);
}

// The action bar sticks to the bottom of the screen, so the sharer never
// scrolls to act. Picking a rule and the contributor's reply open on top.
// A wrong merge also gets a comment from someone watching the repo, so the
// team hears about it right away; the health cost still lands overnight.
// With a clock running, the first press on Message Ren asks to confirm on
// the button itself, so the confirm can't end up off screen. It stays asked
// until the team moves on, however long they talk it over.
function actionsHtml(p) {
  const hinted = state.hinted[p.num];
  const done = state.pending === p.num;
  const free = !state.clockEndsAt;
  return `<div class="actions">
    ${hinted ? `<div class="hintbox" tabindex="-1">${bubble('Ren', BY_NUM[p.num].hint)}</div>` : ''}
    <div class="row"><button class="cta" data-act="merge" type="button"${done ? ' disabled' : ''}>Merge</button><button class="btn-close" data-act="close" type="button"${done ? ' disabled' : ''}>Close</button>
    ${hinted || done ? '' : hintButton(free, hintWait(state, Date.now()))}</div></div>`;
}
function hintButton(free, wait) {
  if (wait > 0) {
    return `<button class="ghost" data-act="hint" data-wait="1" type="button" disabled title="Read the PR first. Ren answers after 30 seconds on it.">Message Ren (opens in ${Math.ceil(wait / 1000)}s)</button>`;
  }
  const label = free ? 'Message Ren (free in overtime)' : ui.hintArmed ? 'Yes, message Ren (costs 1:00)' : 'Message Ren (costs 1:00)';
  return `<button class="ghost${ui.hintArmed && !free ? ' armed' : ''}" data-act="hint" type="button">${label}</button>`;
}
function resetButton(label, armedLabel) {
  return `<button class="ghost${armed(ui.resetArmed) ? ' armed' : ''}" data-act="reset" type="button">${armed(ui.resetArmed) ? armedLabel : label}</button>`;
}
function modalHtml(p) {
  if (state.pending === p.num) {
    const d = state.decisions[p.num];
    const merged = d.call === 'merge';
    const flag = d.kind === 'badMerge' ? answer(p.num).flag : null;
    const costly = state.day !== OT && ['badMerge', 'goodClosed', 'wrongReason'].includes(d.kind);
    // A meter at 0 can't drop, but the call was still wrong, so say so.
    const costText = d.kind === 'badMerge'
      ? (d.cost ? 'Project health −1 overnight' : state.health ? 'Project health runs out overnight' : 'Project health is already at 0')
      : (d.cost ? 'Contributor goodwill −1' : 'Contributor goodwill is already at 0');
    const last = state.idx >= dayPrs(state.day).length - 1;
    const lastLabel = state.day === OT ? "Read Ren's notes" : 'End the day';
    return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="PR #${p.num} ${merged ? 'merged' : 'closed'}">
      <p class="eyebrow">PR #${p.num}</p>
      <span class="stamp ${merged ? 'merged' : 'closed'}">${merged ? 'MERGED' : `CLOSED · RULE ${rule(d.reason).n}`}</span>${costly ? `<span class="cost">${costText}</span>` : ''}
      ${bubble(p.author, replyFor(p, d))}${flag ? bubble(flag.from, flag.text) : ''}
      <div class="row" style="margin-top:18px"><button class="cta" data-act="next-pr" type="button" autofocus>${last ? lastLabel : 'Next PR'}</button></div></div></div>`;
  }
  if (!ui.closing) return '';
  return `<div class="overlay" data-act="cancel-close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="close-h">
    <p class="eyebrow">Close PR #${p.num}</p><h2 class="modal-h" id="close-h">Which rule does it break?</h2>
    <p class="soft small">If it breaks more than one, any of them counts.</p>
    ${rulesFor(state.day).map((r) => `<button type="button" class="reason" data-act="pick-reason" data-r="${r.id}" aria-pressed="${ui.reason === r.id}">`
      + `<span class="rule-n">${r.n}</span><span><span class="rule-name">${r.name}</span><span class="rule-text" style="display:block">${r.text}</span></span></button>`).join('')}
    <div class="row modal-foot"><button class="btn-close" data-act="confirm-close" type="button"${ui.reason ? '' : ' disabled'}>Close PR #${p.num}</button>
    <button class="ghost" data-act="cancel-close" type="button">Cancel</button></div></div></div>`;
}
// While a pop-up is open, the PR behind it is inert: no focus, no clicks.
// Redrawing the same pop-up (picking a rule) keeps its scroll and doesn't
// replay its entrance.
let lastModal = '';
function renderQueue() {
  const prs = dayPrs(state.day);
  const p = prs[state.idx];
  const old = view.querySelector('.modal');
  const oldScroll = old ? old.scrollTop : 0;
  const modalKey = state.pending === p.num ? `r${p.num}` : ui.closing ? `c${p.num}` : '';
  const main = `<p class="eyebrow where">${dayName(state.day)} · PR ${state.idx + 1} of ${prs.length}</p>${prCard(p, actionsHtml(p))}`;
  show('queue', withSide(main, rulebook(state.day), 'House rules') + modalHtml(p));
  view.querySelector('.layout').inert = !!view.querySelector('.overlay');
  const modal = view.querySelector('.modal');
  if (modal && old && modalKey === lastModal) { modal.classList.add('still'); modal.scrollTop = oldScroll; }
  lastModal = modalKey;
  const focus = view.querySelector('.modal [autofocus]');
  if (focus) focus.focus();
}

function renderOvernight() {
  const cards = state.overnight.map((num) => {
    const c = answer(num).consequence;
    const head = c.from === 'Ren' ? 'Message from Ren' : `New issue from @${esc(c.from)}`;
    return `<div class="card issue-card"><p class="eyebrow">${head}</p><h3>${c.title}</h3><p style="margin:0">${c.text}</p><p class="cause">${c.cause}</p></div>`;
  }).join('');
  const n = state.overnight.length;
  const lost = state.healthLost === undefined ? n : state.healthLost;
  show('overnight', `<p class="eyebrow">Overnight</p><h1 class="title">${n === 1 ? 'A new issue came in' : `${n} new issues came in`}</h1>
    <p class="lead">${n === 1 ? "One of today's merges caused trouble after it went in." : "Some of today's merges caused trouble after they went in."} ${lost ? `Project health −${lost}, now ${state.health} of ${METER_MAX}.` : 'Project health was already at 0.'}</p>
    ${cards}<button class="cta" data-act="to-notes" type="button">Read Ren's notes</button>`, true);
}

function renderNotes() {
  const d = state.day;
  const total = dayPrs(d).length;
  const right = dayRight(state, d);
  const lines = d === OT ? DATA.otNotesLines : DATA.notesLines;
  const perfect = Array.isArray(lines.perfect) ? lines.perfect[d - 1] : lines.perfect;
  const line = right === total ? perfect : right === total - 1 ? lines.good : lines.rough;
  const next = d === OT ? 'Back to your results' : d < 3 ? `Start day ${d + 1}` : "Ren's back. Open your own PR";
  show('notes', `<p class="eyebrow">${d === OT ? 'End of overtime' : `End of day ${d}`}</p><h1 class="title">Ren's notes</h1>
    ${memoBlock([`You got <b>${right} of ${total}</b> right. ${line}`])}
    ${state.dayOver ? `<div class="known">This day ran ${fmt(state.dayOver)} past my suggested time.${d < 3 ? " Try to pick up the pace tomorrow, so there's time for day 4." : ''}</div>` : ''}
    <div class="card">${noteRows(d)}</div>
    <button class="cta" data-act="after-notes" type="button">${next}</button>`, true);
}

// day 4 ---------------------------------------------------------------
function materials() {
  const d4 = DATA.day4;
  const st = state ? state.d4.step : 0;
  const ids = steps().map((x) => x.id);
  const rowFixed = st > ids.indexOf('row');
  const branchFixed = st > ids.indexOf('reject');
  const commits = d4.commits.filter((c, i) => !(branchFixed && i === d4.commits.length - 1));
  const must = d4.mustPass.map((r) => `<li><span class="job">${esc(r.check)}</span> <code>${esc(rowFixed && r.check === 'tests' ? d4.fixedTestsCmd : r.cmd)}</code>`
    + `<span class="commit-file">source: ${esc(r.source)}</span></li>`).join('');
  const excl = d4.excluded.map((r) => `<li><span class="job">${esc(r.check)}</span> <code>${esc(r.cmd)}</code>`
    + `<span class="commit-file">since ${esc(r.since)}: ${r.why}</span></li>`).join('');
  return `<h2>Your PR's materials</h2>
    <div class="issue" style="margin-bottom:12px"><div class="issue-t">#${d4.issue.num} ${d4.issue.title}</div><div class="issue-b">${d4.issue.body}</div></div>
    <div class="doc"><div class="doc-head">plan.md (scope)</div><pre>${d4.plan.map(esc).join('\n')}</pre></div>
    <div class="doc"><div class="doc-head">commits on ${esc(d4.branch)}</div><ul class="commits">${commits.map((c) => `<li>${esc(c.msg)}<span class="commit-file">${esc(c.file)} · ${esc(c.stat)}</span></li>`).join('')}</ul></div>
    <div class="doc"><div class="doc-head">ship-manifest.md</div><div class="mf-h">Must pass before a ship</div><ul class="mf">${must}</ul>
      <div class="mf-h">Excluded, with a dated reason</div><ul class="mf">${excl}</ul></div>
    <div class="doc"><div class="doc-head">pr_draft.md</div><div class="desc" style="padding:0;background:none"><ol>${d4.draft.map((it) => `<li><span class="item-n">${it.n}.</span><span>${it.label ? `<span class="item-l">${it.label}:</span> ` : ''}${it.text}</span></li>`).join('')}</ol></div></div>`;
}
let typing = null;
function termBlock(lines, animate, onDone) {
  const id = `term-${Date.now()}`;
  const html = `<div class="term" id="${id}" aria-live="polite"><pre>${animate ? '' : lines.map((l) => `<span class="line">${termLine(l)}</span>`).join('')}</pre></div>`;
  if (animate) {
    setTimeout(() => {
      const pre = document.querySelector(`#${id} pre`);
      if (!pre) return;
      let i = 0;
      clearInterval(typing);
      typing = setInterval(() => {
        if (i >= lines.length) { clearInterval(typing); typing = null; onDone(); return; }
        pre.insertAdjacentHTML('beforeend', `<span class="line in">${termLine(lines[i])}</span>`);
        i += 1;
      }, 320);
    }, 0);
  }
  return html;
}
function choiceButton(o, part, i, picked, disabled) {
  return `<button type="button" class="choice${o.mono ? ' mono' : ''}" data-act="d4-pick" data-part="${part}" data-i="${i}" aria-pressed="${picked === i}"${disabled ? ' disabled' : ''}>`
    + `${o.label}${o.sub ? `<span class="sub">${o.sub}</span>` : ''}</button>`;
}
function renderDay4() {
  const all = steps();
  const d4 = DATA.day4;
  if (state.d4.step >= all.length) { renderFinal(); return; }
  const st = all[state.d4.step];
  const now = Date.now();
  const locked = now < state.d4.lockUntil;
  const res = state.d4.result;
  const animate = !!st.run && !state.d4.seen[st.id];
  const lines = (st.run || []).concat(res && res.out ? res.out : []);
  const busy = animate;
  let choices;
  if (st.parts) {
    choices = st.parts.map((pt) => `<div class="part"><div class="part-h">${esc(pt.label)}</div><div class="choices">`
      + pt.options.map((o, i) => choiceButton(o, pt.id, i, state.d4.picks[pt.id], busy || locked || (res && res.right))).join('') + '</div></div>').join('')
      + (res && res.right ? '' : `<button class="cta" data-act="d4-submit" type="button"${busy || locked || st.parts.some((pt) => state.d4.picks[pt.id] === undefined) ? ' disabled' : ''}>Make these fixes and run it again</button>`);
  } else {
    choices = `<div class="choices">${st.options.map((o, i) => choiceButton(o, 'main', i, state.d4.picks.main, busy || locked || (res && res.right))).join('')}</div>`;
  }
  const result = res ? `<div class="result ${res.right ? 'good' : 'bad'}" aria-live="polite">${res.says.map((x) => `<p style="margin:0 0 6px">${x.label ? `<b>${esc(x.label)}:</b> ` : ''}${x.text}</p>`).join('')}`
    + (!res.right && locked ? `<div class="wait" id="d4-wait">${waitText(state.d4.lockUntil - now)}</div>` : '')
    + (res.right ? `<div class="row" style="margin-top:10px"><button class="cta" data-act="d4-next" type="button">${state.d4.step === all.length - 1 ? 'Open it again' : 'Next'}</button></div>` : '') + '</div>' : '';
  const intro = state.d4.step === 0 ? memoBlock(d4.intro) : '';
  // A step's own terminal run sets up its question; a pick's output (like
  // the push) answers it, so that goes below.
  const term = lines.length ? termBlock(lines, animate, () => { state.d4.seen[st.id] = true; save(); renderDay4(); }) : '';
  const main = `<p class="eyebrow">Day 4 · Your PR · step ${state.d4.step + 1} of ${all.length}</p><h1 class="title">Ship your own PR</h1>${intro}
    ${st.run ? term : ''}
    <p class="ask">${st.ask}</p>${choices}${st.run ? '' : term}${result}`;
  show('day4', withSide(main, materials(), "Your PR's materials"));
}
function renderFinal() {
  const d4 = DATA.day4;
  const seen = state.d4.seen.final;
  const card = `<div class="panel"><span class="stamp merged">MERGED</span>${bubble('Ren', d4.renReview)}
      <div class="row" style="margin-top:14px"><button class="cta" data-act="d4-finish" type="button">See how your team did</button></div></div>`
    + prCard(d4.finalPr, '', true);
  const main = `<p class="eyebrow">Day 4 · Your PR</p><h1 class="title">Ship your own PR</h1>
    ${termBlock(d4.finalRun, !seen, () => { state.d4.seen.final = true; save(); renderFinal(); confetti(); })}
    ${seen ? card : ''}`;
  show('day4', main, true);
}

function renderDone() {
  const total = mainPrs().length;
  // Ren's line follows the weaker meter, so a team can't merge everything
  // (or close everything) and still hear that all went well.
  const low = Math.min(state.health, state.goodwill);
  const roughLine = state.health < state.goodwill ? DATA.finalLines.roughHealth
    : state.goodwill < state.health ? DATA.finalLines.roughGoodwill : DATA.finalLines.rough;
  const line = low >= 4 ? DATA.finalLines.great : low >= 2 ? DATA.finalLines.ok : roughLine;
  const otDone = state.overtime === 'done';
  const days = otDone ? [1, 2, 3, OT] : [1, 2, 3];
  const review = days.map((d) => `<details><summary>${dayName(d)}: ${dayRight(state, d)} of ${dayPrs(d).length} right</summary><div class="inner">${noteRows(d)}</div></details>`).join('');
  const overtime = otDone
    ? `<div class="panel"><p style="margin:0">Overtime: <b>${dayRight(state, OT)} of ${dayPrs(OT).length}</b> right. Ren's notes on each one are at the bottom of this page.</p></div>`
    : `<div class="panel"><p style="margin:0 0 12px"><b>Finished early?</b> Ren has ${dayPrs(OT).length} more PRs for overtime, the hardest ones in the queue. There's no clock, and they don't change your score.</p>
       <button class="cta" data-act="ot-start" type="button">Play overtime</button></div>`;
  show('done', `<div class="hero closing"><div class="hero-art" aria-hidden="true"><div class="splotch"><i></i><i></i><i></i><i></i></div></div>
      <div class="hero-text"><p class="eyebrow">AI301 · Unit 7 · ${esc(teamLabel(state.team))}</p><h1 class="title big">Your PR is merged.</h1>
      <p class="lead">Ren says, "${line}"</p></div></div>
    <div class="tally">
      <div class="tile"><span class="tile-n">${rightCount(state)} of ${total}</span><span class="tile-l">right calls</span></div>
      <div class="tile"><span class="tile-n">${state.health} of ${METER_MAX}</span><span class="tile-l">project health</span></div>
      <div class="tile"><span class="tile-n">${state.goodwill} of ${METER_MAX}</span><span class="tile-l">contributor goodwill</span></div>
      <div class="tile"><span class="tile-n">${fmt(state.finishedAt - state.startedAt)}</span><span class="tile-l">start to finish</span></div></div>
    ${overtime}
    <h2 class="title" style="font-size:24px">Talk it over</h2>
    <ul class="stars">${DATA.talk.map((t) => `<li>${t}</li>`).join('')}</ul>
    <p>Next, you do it for real. The Assignment tab walks you through installing the ship-gate on your own repo.</p>
    <h2 class="title" style="font-size:24px;margin-top:26px">Look back at Ren's notes</h2>
    <div class="review">${review}</div>
    <p style="margin-top:18px">${resetButton('Start over (new team)', 'Yes, erase your results')}</p>`, true);
}

function renderRead() {
  const tabs = [1, 2, 3, 4, OT].map((d) => `<button type="button" class="tab" role="tab" data-act="read-tab" data-day="${d}" aria-selected="${reading === d}">${d === 4 ? 'Day 4: your PR' : dayName(d)}</button>`).join('');
  let body;
  if (reading === 4) {
    // Each day-4 step's terminal output answers the step before it, so
    // readers follow the sharer's screen instead of reading ahead.
    body = `<div class="known">Day 4 plays on your sharer's screen. Follow along there.</div>${memoBlock(DATA.day4.intro)}${materials()}`;
  } else {
    const cards = dayPrs(reading).map((p) => prCard(p, '')).join('');
    body = withSide(`${memoFor(reading)}<div class="stack">${cards}</div>`, rulebook(reading), 'House rules');
  }
  show('read', `<div class="read-banner">You're reading along. Your team's sharer makes the calls on their screen.</div>
    <div class="tabs" role="tablist">${tabs}</div>${body}
    <p style="margin-top:22px"><button class="ghost" data-act="read-exit" type="button">Back to the start</button></p>`, reading === 4);
}

function confetti() {
  const box = $('confetti');
  if (!box || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.style.left = `${Math.random() * 100}vw`;
    p.style.background = CFG.confetti[i % CFG.confetti.length];
    p.style.animationDuration = `${2 + Math.random() * 2.5}s`;
    p.style.animationDelay = `${Math.random() * 0.6}s`;
    p.style.borderRadius = i % 3 ? '2px' : '50%';
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 5500);
}

// ------------------------------------------------------------ events
view.addEventListener('submit', (e) => {
  if (e.target.id !== 'team-form') return;
  e.preventDefault();
  const name = $('team-name').value.replace(/\s+/g, ' ').trim();
  if (!name) return;
  state = newState(name, Date.now(), newId());
  shown = { health: null, goodwill: null };
  save(); report('join'); render();
});

view.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.classList.contains('overlay') && e.target !== b) return;
  const act = b.dataset.act;
  const now = Date.now();
  if (act === 'read') { reading = 1; render(); return; }
  if (act === 'read-tab') { reading = Number(b.dataset.day); render(); return; }
  if (act === 'read-exit') { reading = null; render(); return; }
  if (act === 'resume') { state = store.get(CFG.storeKey); shown = { health: null, goodwill: null }; ui.resetArmed = 0; render(); scheduleUnlock(); return; }
  if (act === 'reset') {
    // Start over erases the saved game, so the first press only asks.
    if (!armed(ui.resetArmed)) {
      const at = now;
      ui.resetArmed = at; render(false); focusAct('reset');
      setTimeout(() => { if (ui.resetArmed === at) { ui.resetArmed = 0; render(false); } }, CONFIRM_MS + 100);
      return;
    }
    ui.resetArmed = 0; store.del(CFG.storeKey); state = null; render();
    const field = $('team-name');
    if (field) field.focus();
    return;
  }
  if (!state) return;
  const p = state.phase === 'queue' ? dayPrs(state.day)[state.idx] : null;
  switch (act) {
    case 'open-queue':
      openQueue(state, now); ui = { closing: false, reason: null, hintArmed: 0 };
      save(); report('day'); render(); break;
    case 'merge':
      decide(state, p.num, 'merge', null); ui.closing = false;
      save(); report('decide'); render(false); break;
    case 'close': {
      ui.closing = !ui.closing; ui.reason = null; render(false);
      const first = view.querySelector('.modal .reason');
      if (first) first.focus();
      break;
    }
    case 'pick-reason':
      ui.reason = b.dataset.r; render(false); break;
    case 'cancel-close':
      ui.closing = false; ui.reason = null; render(false); focusAct('close'); break;
    case 'confirm-close':
      if (!ui.reason) break;
      decide(state, p.num, 'close', ui.reason); ui.closing = false; ui.reason = null;
      save(); report('decide'); render(false); break;
    case 'hint':
      if (hintWait(state, now) > 0) break;
      // With a clock running, the first press arms and the second sends.
      if (state.clockEndsAt && !ui.hintArmed) {
        ui.hintArmed = now; render(false); focusAct('hint');
        break;
      }
      ui.hintArmed = 0; useHint(state, p.num, now); save(); report('hint'); render(false);
      view.querySelector('.hintbox').focus({ preventScroll: true }); break;
    case 'next-pr':
      nextPr(state, now); ui = { closing: false, reason: null, hintArmed: 0, resetArmed: 0 };
      save(); if (state.phase !== 'queue') report('day'); render(); break;
    case 'to-notes':
      state.phase = 'notes'; save(); render(); break;
    case 'after-notes':
      afterNotes(state); save(); report('day'); render(); break;
    case 'd4-pick': {
      if (state.d4.result && state.d4.result.right) break;
      state.d4.picks[b.dataset.part] = Number(b.dataset.i);
      const st = steps()[state.d4.step];
      if (!st.parts) { d4Submit(state, now); report('step'); }
      save(); render(false); scheduleUnlock(); showResult(); break;
    }
    case 'd4-submit':
      d4Submit(state, now); save(); report('step'); render(false); scheduleUnlock(); showResult(); break;
    case 'd4-next':
      d4Next(state); save(); render(); break;
    case 'd4-finish':
      finish(state, now); save(); report('finish'); render(); break;
    case 'ot-start':
      startOvertime(state); save(); render(); break;
    default: break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.closing && state && state.phase === 'queue') { ui.closing = false; ui.reason = null; render(false); focusAct('close'); }
});

// After a day-4 pick, scroll just enough to show what it says and its Next.
function showResult() {
  const r = view.querySelector('.result');
  if (r) r.scrollIntoView({ block: 'nearest' });
}

let unlockTimer = null;
function scheduleUnlock() {
  clearInterval(unlockTimer);
  if (!state || state.phase !== 'day4' || Date.now() >= state.d4.lockUntil) return;
  unlockTimer = setInterval(() => {
    const left = state.d4.lockUntil - Date.now();
    const w = $('d4-wait');
    if (left <= 0) { clearInterval(unlockTimer); render(false); return; }
    if (w) w.textContent = waitText(left);
  }, 250);
}

// Count down a locked Message Ren, and open it on time.
setInterval(() => {
  const b = view.querySelector('[data-act="hint"][data-wait]');
  if (!b || !state || reading !== null || state.phase !== 'queue') return;
  const wait = hintWait(state, Date.now());
  if (wait > 0) b.textContent = `Message Ren (opens in ${Math.ceil(wait / 1000)}s)`;
  else b.outerHTML = hintButton(!state.clockEndsAt, 0);
}, 250);

// The queue clock, plus a once-a-minute ping for the board.
setInterval(() => {
  if (!state || reading !== null || state.phase !== 'queue' || !state.clockEndsAt) return;
  updateClock();
}, 250);
setInterval(() => { if (state && !state.finishedAt && reading === null) report('ping'); }, 60000);

state = null;
render();
})();
</script>
</body>
</html>
